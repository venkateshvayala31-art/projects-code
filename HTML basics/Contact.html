<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Venky Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">Venky Life</a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="Skills.html">Skills</a>
          <a href="Contact.html">Contact</a>
          <a href="Login.html">Login</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-content">
        <h1>Contact</h1>
        <p>If you'd like to work together, send a message using the form below.</p>
        <section class="about-summary">
          <form class="contact-form" id="contactForm" action="/api/contact" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Tell me about your project" required></textarea>

            <button class="button primary" type="submit">Send Message</button>
            <div id="formMessage"></div>
          </form>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Vayala Venky. Built with HTML and CSS.</p>
    </footer>
  </body>
</html>
